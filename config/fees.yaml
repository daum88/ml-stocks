# fees.yaml — exchange fees and order constraints (filled by the HUMAN after Phase 0)
# Exchange DECIDED: Bitvavo. Verified 2026-10-19 against the public API.
# TODO before lock: record the ACCOUNT HOLDER'S OWN fee tier (the 0.15/0.25 figures are base).

exchange:
  name: "bitvavo"                # DECIDED (Kraken ~2x cost rejected)
  market: "BTC-EUR"
  maker_fee_pct: 0.15            # base rate — CONFIRM your own account tier before the lock
  taker_fee_pct: 0.25            # base rate — CONFIRM your own account tier before the lock

order_constraints:
  # Verified from Bitvavo public /markets for BTC-EUR (2026-10-19)
  min_order_quote_eur: 5.00
  min_order_base_btc: 0.00006942
  quantity_step_btc: 0.00000001  # quantityDecimals: 8
  price_tick_eur: 1.00           # tickSize: 1.00
  max_open_orders: 400

post_only:
  # D8 requires post-only maker entries. NOT in orderTypes (that list is order types, not flags).
  # Docs show a postOnly BOOLEAN on POST /order ("postOnly": false in cancel-on-disconnect examples;
  # cancellation reasons cancelPostOnly / cancelPostOnlyOnAuctionMatching).
  supported: "LIKELY"            # final confirm via live Create Order page or a tiny test order
  confirm_method: "place postOnly:true limit above the ask -> must be cancelled, not filled"
